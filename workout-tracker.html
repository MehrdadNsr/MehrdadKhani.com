<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ثبت تمرین</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --lapis:#0C1633; --surface:#15224A; --surface-2:#1C2C5C; --line:#2B3D72;
    --chalk:#EFE8D8; --muted:#8C9BC4; --firooze:#3ECFC0; --zaferan:#E8A62D;
    --sorkh:#E86A5C; --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--lapis);color:var(--chalk);
    font-family:'Vazirmatn','IRANSans','Segoe UI',Tahoma,sans-serif;
    line-height:1.7;padding:0 0 90px;max-width:660px;margin:0 auto;min-height:100vh;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea{font-family:inherit}

  .topbar{
    position:sticky;top:0;z-index:40;background:var(--lapis);
    border-bottom:1px solid var(--line);padding:14px 16px 12px;
    display:flex;align-items:center;gap:10px;
  }
  .topbar h1{font-size:1.02rem;font-weight:700;line-height:1.4}
  .topbar .sub{display:block;font-size:.73rem;color:var(--muted);font-weight:400}
  .iconbtn{
    flex:0 0 auto;width:34px;height:34px;border-radius:9px;
    border:1px solid var(--line);color:var(--muted);
    display:flex;align-items:center;justify-content:center;font-size:1.1rem;
  }
  .iconbtn:active{background:var(--surface-2)}
  .savedot{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:var(--firooze);opacity:0;transition:opacity .3s}
  .savedot.on{opacity:1}
  .savedot.err{background:var(--sorkh);opacity:1}

  .wrap{padding:18px 16px 0}

  .nav{
    position:fixed;bottom:0;left:0;right:0;z-index:50;
    background:var(--lapis);border-top:1px solid var(--line);
    display:flex;max-width:660px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom);
  }
  .nav button{flex:1;padding:11px 4px 13px;color:var(--muted);font-size:.7rem;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px}
  .nav button .ic{font-size:1.15rem;line-height:1}
  .nav button.on{color:var(--firooze)}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px;margin-bottom:13px}
  .card.acc{border-inline-start:3px solid var(--firooze)}
  .card.warn{border-inline-start:3px solid var(--zaferan)}
  .card.bad{border-inline-start:3px solid var(--sorkh)}
  .card h3{font-size:.95rem;font-weight:700;margin-bottom:5px}
  .card p{font-size:.84rem;color:var(--muted)}
  .eyebrow{font-size:.7rem;letter-spacing:.13em;color:var(--firooze);font-weight:700;margin-bottom:7px}
  .empty{text-align:center;color:var(--muted);font-size:.86rem;padding:44px 20px}
  .sectitle{font-size:.73rem;letter-spacing:.11em;color:var(--muted);font-weight:700;margin:26px 0 11px;padding-bottom:6px;border-bottom:1px solid var(--line)}

  .btn{display:block;width:100%;padding:13px;border-radius:11px;background:var(--firooze);color:var(--lapis);font-weight:700;font-size:.92rem;text-align:center}
  .btn:active{opacity:.82}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--chalk);font-weight:500}
  .btn.ghost:active{background:var(--surface-2)}
  .btn.danger{background:transparent;border:1px solid var(--sorkh);color:var(--sorkh);font-weight:500}
  .btn.sm{padding:9px;font-size:.83rem;border-radius:9px}
  .btnrow{display:flex;gap:9px;margin-top:11px}
  .btnrow .btn{margin:0}

  .daycard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px;margin-bottom:10px;display:flex;align-items:center;gap:12px;width:100%;text-align:right}
  .daycard.next{border-inline-start:3px solid var(--zaferan)}
  .daycard .dn{flex:0 0 34px;height:34px;border-radius:9px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:.82rem;font-weight:700;color:var(--firooze)}
  .daycard .dtxt{flex:1;min-width:0}
  .daycard .dtxt b{display:block;font-size:.93rem;font-weight:700}
  .daycard .dtxt span{font-size:.75rem;color:var(--muted)}
  .daycard .badge{flex:0 0 auto;font-size:.68rem;font-weight:700;color:var(--zaferan);background:rgba(232,166,45,.14);padding:3px 8px;border-radius:20px}

  .block{margin-bottom:20px}
  .bhead{display:flex;align-items:baseline;gap:9px;margin-bottom:8px;padding-inline-start:2px}
  .bhead .bid{font-size:.72rem;font-weight:700;color:var(--firooze);letter-spacing:.05em}
  .bhead .btype{font-size:.72rem;color:var(--muted)}
  .station{font-size:.73rem;color:var(--muted);background:rgba(62,207,192,.07);border:1px solid var(--line);border-radius:9px;padding:7px 11px;margin-bottom:10px}
  .station b{color:var(--firooze);font-weight:500}

  .round{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:9px;overflow:hidden}
  .round.sup{border-inline-end:3px solid var(--firooze)}
  .rlabel{font-size:.7rem;color:var(--muted);padding:7px 13px;background:var(--surface-2);border-bottom:1px solid var(--line);font-weight:500}

  .setrow{padding:11px 13px}
  .setrow + .setrow{border-top:1px dashed var(--line)}
  .setrow.done{background:rgba(62,207,192,.05)}
  .srtop{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
  .srtop .code{font-size:.7rem;font-weight:700;color:var(--firooze);flex:0 0 auto}
  .srtop .nm{font-size:.87rem;font-weight:500;flex:1;min-width:0;line-height:1.45}
  .srtop .tgt{font-size:.71rem;color:var(--muted);flex:0 0 auto;white-space:nowrap}
  .last{font-size:.71rem;color:var(--muted);margin-bottom:8px}
  .last b{color:var(--chalk);font-weight:500}

  /* ---- عدد کشویی ---- */
  .inrow{display:flex;align-items:center;gap:7px;margin-bottom:9px}
  .nf{flex:1;display:flex;align-items:center;background:var(--lapis);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
  .nf.pull{border-color:var(--firooze)}
  .nfb{flex:0 0 40px;height:42px;color:var(--muted);font-size:1.25rem;font-weight:700;display:flex;align-items:center;justify-content:center}
  .nfb:active{background:var(--surface-2);color:var(--firooze)}
  .nfv{
    flex:1;min-width:0;height:42px;background:transparent;border:none;outline:none;
    color:var(--chalk);font-size:1.08rem;font-weight:900;text-align:center;
    font-variant-numeric:tabular-nums;touch-action:pan-y;cursor:ew-resize;padding:0;
  }
  .nfv::placeholder{color:var(--line);font-weight:400}
  .nfv:not([readonly]){color:var(--firooze)}
  .nfcap{flex:0 0 auto;font-size:.66rem;color:var(--muted);padding-inline-end:9px}
  .wu{flex:0 0 auto;width:42px;height:42px;border-radius:10px;border:1px solid var(--line);color:var(--muted);font-size:.85rem;display:flex;align-items:center;justify-content:center;font-weight:700}
  .wu.on{border-color:var(--zaferan);color:var(--zaferan);background:rgba(232,166,45,.12)}
  .ok{flex:0 0 auto;width:52px;height:42px;border-radius:10px;background:var(--firooze);color:var(--lapis);font-size:1.05rem;font-weight:700;display:flex;align-items:center;justify-content:center}
  .ok.undo{background:transparent;border:1px solid var(--line);color:var(--muted);font-size:.9rem}

  /* ---- ردیف ضربه‌ای ---- */
  .chiprow{display:flex;align-items:center;gap:5px;margin-top:8px}
  .chiprow .lb{font-size:.66rem;color:var(--muted);flex:0 0 30px}
  .chiprow .cs{
    display:flex;gap:4px;flex:1;min-width:0;
    overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
    scroll-behavior:smooth;padding-bottom:2px;
  }
  .chiprow .cs::-webkit-scrollbar{display:none}
  .chiprow .cs button{
    flex:0 0 40px;padding:8px 0;border-radius:8px;border:1px solid var(--line);
    color:var(--muted);font-size:.82rem;font-weight:700;font-variant-numeric:tabular-nums;
  }
  .chiprow .cs button.tgt{border-color:rgba(62,207,192,.45);color:var(--chalk);background:rgba(62,207,192,.06)}
  .chiprow .cs button.on{background:var(--firooze);border-color:var(--firooze);color:var(--lapis)}
  .chiprow.rir .cs button{flex:1;padding:5px 0;font-size:.74rem}
  .chiprow.rir .cs{overflow:visible}
  .chiprow.rir .cs button.on{background:var(--surface-2);border-color:var(--firooze);color:var(--firooze)}

  /* ---- حالت ثبت‌شده ---- */
  .donerow{display:flex;align-items:center;gap:9px}
  .donerow .val{flex:1;font-size:1rem;font-weight:900;color:var(--firooze);font-variant-numeric:tabular-nums}
  .donerow .val small{font-size:.72rem;color:var(--muted);font-weight:400;margin-inline-start:5px}
  .donerow .wtag{font-size:.68rem;color:var(--zaferan);background:rgba(232,166,45,.14);padding:2px 7px;border-radius:20px;font-weight:700}

  .addr{width:100%;padding:9px;border-radius:10px;border:1px dashed var(--line);color:var(--muted);font-size:.78rem;font-weight:500;margin-top:2px}
  .addr:active{border-color:var(--firooze);color:var(--firooze)}

  .timer{position:fixed;bottom:66px;left:0;right:0;z-index:45;max-width:660px;margin:0 auto;padding:0 16px;pointer-events:none}
  .timer .in{background:var(--surface-2);border:1px solid var(--firooze);border-radius:13px;padding:11px 15px;display:flex;align-items:center;gap:13px;pointer-events:auto;box-shadow:0 6px 22px rgba(0,0,0,.4)}
  .timer.hid{display:none}
  .timer .num{font-size:1.65rem;font-weight:900;color:var(--firooze);font-variant-numeric:tabular-nums}
  .timer .lb{flex:1;font-size:.75rem;color:var(--muted);line-height:1.4}
  .timer .lb b{display:block;color:var(--chalk);font-size:.82rem;font-weight:500}
  .timer button{flex:0 0 auto;padding:6px 11px;border-radius:8px;border:1px solid var(--line);color:var(--muted);font-size:.76rem;font-weight:500}
  .timer.over .in{border-color:var(--zaferan)}
  .timer.over .num{color:var(--zaferan)}

  .modal{position:fixed;inset:0;z-index:80;background:rgba(6,11,26,.82);display:flex;align-items:flex-end;justify-content:center}
  .modal.hid{display:none}
  .sheet{background:var(--lapis);border-top:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:660px;max-height:92vh;overflow-y:auto;padding:20px 16px calc(26px + env(safe-area-inset-bottom))}
  .sheet h2{font-size:1.08rem;font-weight:700;margin-bottom:4px}
  .sheet .sh{font-size:.8rem;color:var(--muted);margin-bottom:18px}
  .grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 16px}

  .qz{margin-bottom:16px}
  .qz .q{font-size:.85rem;font-weight:500;margin-bottom:7px}
  .qz .opts{display:flex;gap:6px}
  .qz .opts button{flex:1;padding:9px 4px;border-radius:9px;border:1px solid var(--line);color:var(--muted);font-size:.78rem;font-weight:500;line-height:1.35}
  .qz .opts button.on{background:var(--surface-2);border-color:var(--firooze);color:var(--firooze);font-weight:700}

  .fldbox{flex:1;margin-bottom:16px}
  .fldbox label{display:block;font-size:.76rem;color:var(--muted);margin-bottom:5px}
  .fldbox input,.fldbox textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;color:var(--chalk);font-size:.9rem;padding:10px;outline:none;resize:vertical}
  .fldbox input:focus,.fldbox textarea:focus{border-color:var(--firooze)}

  .summ{display:flex;gap:9px;margin-bottom:16px}
  .summ div{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 8px;text-align:center}
  .summ b{display:block;font-size:1.2rem;font-weight:900;color:var(--firooze);line-height:1.3}
  .summ span{font-size:.7rem;color:var(--muted)}

  textarea.exp{width:100%;height:130px;background:#080F24;border:1px solid var(--line);border-radius:10px;color:#C6D4F5;font-size:.7rem;padding:11px;direction:ltr;text-align:left;font-family:monospace;outline:none}
  .hist{border-bottom:1px solid var(--line);padding:11px 0;font-size:.84rem;display:flex;gap:10px}
  .hist .hd{color:var(--muted);font-size:.75rem;flex:0 0 auto}
  .hist .hn{flex:1}
  .hist .hs{color:var(--firooze);font-size:.76rem;font-weight:700;flex:0 0 auto}
</style>
</head>
<body>

<div class="topbar">
  <div style="flex:1;min-width:0">
    <h1><span id="ttl">ثبت تمرین</span><span class="sub" id="sub"></span></h1>
  </div>
  <div class="savedot" id="dot"></div>
  <button class="iconbtn" id="btnExp">⇩</button>
</div>

<div class="wrap" id="view"></div>

<div class="timer hid" id="timer">
  <div class="in">
    <div class="num" id="tnum">0:00</div>
    <div class="lb"><b id="tlb">استراحت</b><span id="tsub"></span></div>
    <button id="tadd">+۳۰</button>
    <button id="tskip">رد</button>
  </div>
</div>

<div class="nav">
  <button data-tab="home" class="on"><span class="ic">▣</span>خانه</button>
  <button data-tab="session"><span class="ic">✦</span>تمرین</button>
  <button data-tab="progress"><span class="ic">◔</span>پیشرفت</button>
  <button data-tab="settings"><span class="ic">⚙</span>تنظیمات</button>
</div>

<div class="modal hid" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
"use strict";

/* ==========================================================================
   لایه ۱ — ذخیره‌سازی
   هر تماس با مهلت زمانی و پوشش خطا. هیچ خطایی نباید اپ را متوقف کند.
   ========================================================================== */
var StoreState = { engine:'—', ok:true, lastError:null };

function withTimeout(promise, ms){
  return new Promise(function(resolve, reject){
    var done = false;
    var t = setTimeout(function(){ if(!done){ done=true; reject(new Error('timeout')); } }, ms);
    Promise.resolve(promise).then(
      function(v){ if(!done){ done=true; clearTimeout(t); resolve(v); } },
      function(e){ if(!done){ done=true; clearTimeout(t); reject(e); } }
    );
  });
}

function ArtifactStore(){}
ArtifactStore.prototype.get = function(k){
  return withTimeout(window.storage.get(k,false),6000).then(function(r){
    return r && r.value ? JSON.parse(r.value) : null;
  });
};
ArtifactStore.prototype.set = function(k,v){ return withTimeout(window.storage.set(k,JSON.stringify(v),false),8000); };
ArtifactStore.prototype.del = function(k){ return withTimeout(window.storage.delete(k,false),6000); };

function LocalStore(){ this.p='wt:'; }
LocalStore.prototype.get = function(k){ var v=localStorage.getItem(this.p+k); return Promise.resolve(v?JSON.parse(v):null); };
LocalStore.prototype.set = function(k,v){ localStorage.setItem(this.p+k,JSON.stringify(v)); return Promise.resolve(true); };
LocalStore.prototype.del = function(k){ localStorage.removeItem(this.p+k); return Promise.resolve(true); };

function MemStore(){ this.m={}; }
MemStore.prototype.get = function(k){ return Promise.resolve(this.m[k]!==undefined?this.m[k]:null); };
MemStore.prototype.set = function(k,v){ this.m[k]=JSON.parse(JSON.stringify(v)); return Promise.resolve(true); };
MemStore.prototype.del = function(k){ delete this.m[k]; return Promise.resolve(true); };

var Store;
(function(){
  try{
    if(typeof window!=='undefined' && window.storage && typeof window.storage.get==='function'){
      Store = new ArtifactStore(); StoreState.engine='حافظه دائمی'; return;
    }
  }catch(e){}
  try{
    localStorage.setItem('__t','1'); localStorage.removeItem('__t');
    Store = new LocalStore(); StoreState.engine='حافظه مرورگر'; return;
  }catch(e){}
  Store = new MemStore(); StoreState.engine='موقت'; StoreState.ok=false;
})();

/* خواندن امن: هر خطایی برابر است با «داده‌ای نیست» */
function safeGet(k){
  try{ return Store.get(k).catch(function(e){ StoreState.lastError=String(e); return null; }); }
  catch(e){ StoreState.lastError=String(e); return Promise.resolve(null); }
}
function safeSet(k,v){
  try{ return Store.set(k,v).then(function(){ return true; })
       .catch(function(e){ StoreState.lastError=String(e); StoreState.ok=false; return false; }); }
  catch(e){ StoreState.lastError=String(e); StoreState.ok=false; return Promise.resolve(false); }
}

/* ==========================================================================
   کاتالوگ — در خود فایل تعریف شده، نیازی به ذخیره ندارد
   ========================================================================== */
var MUSCLES = {
  chest:{fa:'سینه',mv:8,mev:10,mrv:22}, back:{fa:'پشت',mv:8,mev:10,mrv:25},
  quads:{fa:'کوادریسپس',mv:6,mev:8,mrv:20}, hamstring:{fa:'همسترینگ',mv:4,mev:6,mrv:20},
  glutes:{fa:'باسن',mv:0,mev:4,mrv:16}, front_delt:{fa:'سرشانه جلو',mv:0,mev:0,mrv:16},
  side_delt:{fa:'سرشانه میانی',mv:6,mev:8,mrv:26}, rear_delt:{fa:'سرشانه عقب',mv:0,mev:6,mrv:24},
  triceps:{fa:'پشت بازو',mv:4,mev:6,mrv:18}, biceps:{fa:'جلو بازو',mv:4,mev:8,mrv:26},
  calves:{fa:'ساق',mv:6,mev:8,mrv:20}, abs:{fa:'شکم',mv:0,mev:0,mrv:25},
  obliques:{fa:'پهلو',mv:0,mev:0,mrv:20}, lower_back:{fa:'فیله',mv:0,mev:2,mrv:12},
  forearms:{fa:'ساعد',mv:0,mev:4,mrv:16}, neck:{fa:'گردن',mv:0,mev:4,mrv:12},
  traps:{fa:'کول',mv:0,mev:4,mrv:20}
};
function E(fa,primary,secondary,equipment,loadType,step,metric,opt){
  var o = {fa:fa,primary:primary,secondary:secondary||[],equipment:equipment,
           loadType:loadType,step:step,metric:metric,unilateral:false,unit:'reps'};
  if(opt){ for(var k in opt) o[k]=opt[k]; }
  return o;
}
var EXERCISES = {
  ex_chest_press_machine:   E('پرس سینه دستگاه یا اسمیت','chest',['front_delt','triceps'],'machine','total',10,'e1rm'),
  ex_db_row_single:         E('روو تک‌دست دمبل','back',['biceps','rear_delt'],'dumbbell','per_hand',5,'e1rm',{unilateral:true}),
  ex_lat_pulldown_wide:     E('لت پول‌داون دست باز','back',['biceps'],'cable','total',10,'e1rm'),
  ex_incline_db_press:      E('بالا سینه دمبل','chest',['front_delt','triceps'],'dumbbell','per_hand',5,'e1rm'),
  ex_cable_fly:             E('فلای کابل یا کراس‌اور','chest',[],'cable','total',5,'volume'),
  ex_cable_pullover:        E('پول‌اور کابل دست صاف','back',[],'cable','total',5,'volume'),
  ex_shoulder_press_machine:E('پرس سرشانه دستگاه','front_delt',['side_delt','triceps'],'machine','total',10,'e1rm'),
  ex_cable_lateral_raise:   E('نشر جانب کابل تک‌دست','side_delt',[],'cable','per_hand',5,'volume',{unilateral:true}),
  ex_face_pull:             E('فیس پول','rear_delt',['side_delt'],'cable','total',5,'volume'),
  ex_triceps_rope_pushdown: E('پشت بازو طنابی','triceps',[],'cable','total',5,'volume'),
  ex_biceps_cable_curl:     E('جلو بازو کابل','biceps',['forearms'],'cable','total',5,'volume'),
  ex_cable_crunch:          E('کرانچ کابل','abs',[],'cable','total',5,'volume'),
  ex_wrist_curl_db:         E('مچ دمبل رو به بالا','forearms',[],'dumbbell','per_hand',2.5,'volume'),
  ex_neck_extension:        E('گردن اکستنشن، دمر روی میز','neck',[],'plate','total',2.5,'volume'),
  ex_neck_flexion:          E('گردن فلکشن، طاق‌باز روی میز','neck',[],'plate','total',2.5,'volume'),
  ex_hack_squat:            E('هاک اسکوات','quads',['glutes','hamstring'],'machine','total',10,'e1rm'),
  ex_rdl:                   E('ددلیفت رومانیایی','hamstring',['glutes','back'],'barbell','total',5,'e1rm'),
  ex_leg_press:             E('پرس پا','quads',['glutes'],'machine','total',10,'e1rm'),
  ex_calf_press_leg_press:  E('ساق پا روی دستگاه پرس پا','calves',[],'machine','total',10,'volume'),

   حالت داخل مرورگر منبع حقیقت است. ذخیره‌سازی فقط لایه ماندگاری.

var DB = {
  ready:false,
  config:{ schema:2, unit:'lb', createdAt:null, lastExport:null, programs:{ active:PROGRAM.id, list:{} } },
  draft:null,
  book:{ recent:{}, sessions:[] },
  _t:null, _fails:0,

  init:function(){
    this.config.createdAt = today();
    this.config.programs.list[PROGRAM.id] = PROGRAM;
  },
  hydrate:function(){
    var self=this;
    return Promise.all([ safeGet('config'), safeGet('draft'), safeGet('book') ])
      .then(function(r){
        if(r[0] && r[0].programs && r[0].programs.list){
          self.config = r[0];
          if(!self.config.programs.list[PROGRAM.id]) self.config.programs.list[PROGRAM.id]=PROGRAM;
          else self.config.programs.list[PROGRAM.id]=PROGRAM;   // همیشه آخرین نسخه برنامه
        } else {
          safeSet('config', self.config);
        }
        if(r[1] && r[1].sets) self.draft = r[1];
        if(r[2] && r[2].sessions) self.book = r[2];
        self.ready=true;
      })
      .catch(function(e){ StoreState.lastError=String(e); self.ready=true; });
  },
  ex:function(id){ return EXERCISES[id] || {fa:id,primary:'chest',secondary:[],step:5,metric:'volume',loadType:'total',unit:'reps'}; },
  prog:function(){ return this.config.programs.list[this.config.programs.active] || PROGRAM; },
  day:function(id){ var d=this.prog().days.filter(function(x){return x.id===id;}); return d[0]; },

  queueDraft:function(){
    var self=this; dot('on'); clearTimeout(this._t);
    this._t = setTimeout(function(){
      safeSet('draft', self.draft).then(function(ok){
        if(ok){ self._fails=0; dot('off'); }
        else { self._fails++; dot('err');
          if(self._fails===3) alert('ذخیره‌سازی چند بار ناموفق بود. جلسه در حافظه هست، ولی از تنظیمات خروجی بگیر.'); }
      });
    }, 900);
  },
  clearDraft:function(){ this.draft=null; return safeSet('draft', null); },

  finishSession:function(s){
    var self=this;
    this.book.sessions.push(s);
    var byEx={};
    s.sets.forEach(function(x){
      if(!x.warmup && x.reps){ (byEx[x.ex]=byEx[x.ex]||[]).push(x); }
    });
    Object.keys(byEx).forEach(function(id){
      var sets=byEx[id], prev=self.book.recent[id]||{}, best=prev.best||null;
      sets.forEach(function(x){
        var sc=score(id,x);
        if(!best || sc>best.score) best={weight:x.weight,reps:x.reps,score:sc,date:s.date};
      });
      self.book.recent[id]={ date:s.date,
        sets:sets.map(function(x){return {weight:x.weight,reps:x.reps,rir:x.rir};}), best:best };
    });
    this.draft=null;
    return safeSet('book', this.book).then(function(){ return safeSet('draft', null); });
  },
  allSessions:function(){
    return this.book.sessions.slice().sort(function(a,b){ return a.startedAt<b.startedAt?1:-1; });
  }
};

function p2(n){ return n<10?'0'+n:''+n; }
function today(){ var d=new Date(); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
function e1rm(w,r){ return r<=0?0:(r===1?w:w*(1+r/30)); }
function score(id,st){
  var ex=DB.ex(id), w=(ex.loadType==='per_hand')?st.weight*2:st.weight;
  return ex.metric==='e1rm'? e1rm(w,st.reps) : w*st.reps;
}
function isHardSet(st){ return !st.warmup && (st.rir==null || st.rir<=3); }
function fa(n){ return String(n).replace(/[0-9]/g,function(d){ return '۰۱۲۳۴۵۶۷۸۹'[+d]; }); }
function toEn(s){
  return String(s).replace(/[۰-۹]/g,function(d){ return String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d)); })
                  .replace(/[٠-٩]/g,function(d){ return String('٠١٢٣٤٥٦٧٨٩'.indexOf(d)); });
}
function num(s){ var v=parseFloat(toEn(String(s).trim()).replace(',','.')); return isNaN(v)?null:v; }
function rounds(bl){ return Math.max.apply(null, bl.items.map(function(i){return i.sets;})); }

var Timer = {
  endAt:null,total:0,label:'',tick:null,beeped:false,
  start:function(sec,label){
    this.endAt=Date.now()+sec*1000; this.total=sec; this.label=label||'استراحت'; this.beeped=false;
    this.render(); clearInterval(this.tick); var s=this; this.tick=setInterval(function(){s.render();},250);
  },
  add:function(sec){ if(this.endAt){ this.endAt+=sec*1000; this.beeped=false; this.render(); } },
  stop:function(){ this.endAt=null; clearInterval(this.tick); this.render(); },
  left:function(){ return this.endAt? Math.round((this.endAt-Date.now())/1000):null; },
  render:function(){
    var el=document.getElementById('timer'), L=this.left();
    if(L===null){ el.classList.add('hid'); return; }
    el.classList.remove('hid');
    var over=L<0, a=Math.abs(L);
    document.getElementById('tnum').textContent=(over?'−':'')+fa(Math.floor(a/60))+':'+fa(p2(a%60));
    document.getElementById('tlb').textContent= over?'استراحت تمام شد':this.label;
    document.getElementById('tsub').textContent= over?'برو ست بعدی':'از '+fa(Math.floor(this.total/60))+':'+fa(p2(this.total%60));
    el.classList.toggle('over',over);
    if(over && !this.beeped){ this.beeped=true; beep(); }
    if(L<-180) this.stop();
  }
};
function beep(){
  try{
    var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    var C=new AC();
    [0,0.18].forEach(function(t){
      var o=C.createOscillator(), g=C.createGain();
      o.frequency.value=784; o.type='sine'; o.connect(g); g.connect(C.destination);
      g.gain.setValueAtTime(0.0001,C.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.25,C.currentTime+t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,C.currentTime+t+0.15);
      o.start(C.currentTime+t); o.stop(C.currentTime+t+0.17);
    });
  }catch(e){}
}

/* ---------- جلسه ---------- */
function findSet(ex,bid,r){
  var f=DB.draft.sets.filter(function(s){ return s.ex===ex&&s.block===bid&&s.round===r; });
  return f[0];
}
function cssKey(k){ return k.replace(/[^a-zA-Z0-9]/g,'_'); }
function parseKey(k){ var p=k.split('|'); return {ex:p[0],block:p[1],round:+p[2]}; }

var ROWS={};                       // key -> {it,bl,r,code}
var PEND={};                       // key -> {w,reps,warmup}  مقدار در حال ویرایش

function extraOf(bid){ return (DB.draft.extra&&DB.draft.extra[bid])||0; }
function totalRounds(bl){ return rounds(bl)+extraOf(bl.id); }

/* مقدار پیشنهادی اولیه: از جلسه قبل، وگرنه کف دامنه */
function seed(it,bl,r){
  var st=findSet(it.ex,bl.id,r);
  if(st) return {w:st.weight,reps:st.reps,warmup:st.warmup};
  if(PEND[it.ex+'|'+bl.id+'|'+r]) return PEND[it.ex+'|'+bl.id+'|'+r];
  var rec=DB.book.recent[it.ex], w=null, reps=it.repLow;
  if(rec&&rec.sets&&rec.sets.length){
    var p=rec.sets[r-1]||rec.sets[rec.sets.length-1];
    w=p.weight; reps=p.reps;
  }
  if(reps<it.repLow) reps=it.repLow;
  if(reps>it.repHigh) reps=it.repHigh;
  return {w:w,reps:reps,warmup:false};
}
function pend(key){
  if(!PEND[key]){ var R=ROWS[key]; PEND[key]=seed(R.it,R.bl,R.r); }
  return PEND[key];
}

function renderSession(){
  if(!DB.draft){
    setTop('تمرین','جلسه‌ای در جریان نیست');
    V().innerHTML='<div class="empty">جلسه‌ای در جریان نیست.<br>از صفحه خانه یک روز را انتخاب کن.</div>';
    return;
  }
  var d=DB.day(DB.draft.dayId);
  if(!d){ V().innerHTML='<div class="empty">این روز در برنامه پیدا نشد.</div>'; return; }
  if(!DB.draft.extra) DB.draft.extra={};
  ROWS={};
  updateCount();
  var h='';
  d.blocks.forEach(function(bl){
    h+='<div class="block"><div class="bhead"><span class="bid">'+bl.id+'</span><span class="btype">'+
       (bl.type==='superset'?'سوپرست · استراحت '+fa(bl.rest)+' ثانیه':'استراحت '+fa(bl.rest)+' ثانیه')+
       '</span></div>';
    if(bl.station) h+='<div class="station">ایستگاه: <b>'+esc(bl.station)+'</b></div>';
    var base=rounds(bl), R=totalRounds(bl);
    for(var r=1;r<=R;r++){
      var items = (r<=base) ? bl.items.filter(function(it){ return it.sets>=r; }) : bl.items;
      h+='<div class="round'+(bl.type==='superset'?' sup':'')+'">';
      h+='<div class="rlabel">'+(bl.type==='superset'?'دور ':'ست ')+fa(r)+' از '+fa(R)+
         (r>base?' · اضافه':'')+'</div>';
      for(var j=0;j<items.length;j++){
        var it=items[j];
        var code=(bl.type==='superset')?bl.id+(bl.items.indexOf(it)+1):bl.id;
        var key=it.ex+'|'+bl.id+'|'+r;
        ROWS[key]={it:it,bl:bl,r:r,code:code};
        h+='<div class="setrow'+(findSet(it.ex,bl.id,r)?' done':'')+'" id="row_'+cssKey(key)+'">'+
           rowInner(key)+'</div>';
      }
      h+='</div>';
    }
    h+='<button class="addr" onclick="addRound(\''+bl.id+'\')">+ یک '+

    h+='</div>';
  });
  h+='<button class="btn" style="margin:24px 0 10px" onclick="askFinish()">پایان جلسه</button>'+
     '<button class="btn ghost" style="margin-bottom:10px" onclick="cancelSession()">لغو جلسه</button>';
  V().innerHTML=h;

  bindChips();
}
function updateCount(){

function rowInner(key){
  var R=ROWS[key], it=R.it, bl=R.bl, r=R.r, code=R.code;
  var ex=DB.ex(it.ex), st=findSet(it.ex,bl.id,r), c=cssKey(key);
  var unit=(ex.unit==='seconds')?'ثانیه':'تکرار';

  var head='<div class="srtop"><span class="code">'+code+'</span><span class="nm">'+esc(ex.fa)+
    '</span><span class="tgt">'+fa(it.repLow)+'–'+fa(it.repHigh)+'</span></div>';

  /* --- ثبت‌شده: نمایش فشرده --- */
  if(st){
    var rir='<div class="chiprow rir"><span class="lb">ذخیره</span><div class="cs">';
    [0,1,2,3,4].forEach(function(n){
      rir+='<button class="'+(st.rir===n?'on':'')+'" onclick="setRir(\''+key+'\','+n+')">'+
           (n===4?fa(4)+'+':fa(n))+'</button>';
    });
    rir+='</div></div>';
    return head+
      '<div class="donerow"><div class="val">'+fa(st.weight)+' <small>پوند</small> × '+
      fa(st.reps)+' <small>'+unit+'</small></div>'+
      (st.warmup?'<span class="wtag">گرم‌کردنی</span>':'')+
      '<button class="ok undo" onclick="undoSet(\''+key+'\')">↺</button></div>'+rir;
  }

  /* --- ثبت‌نشده: ورودی --- */
  var v=pend(key);
  var rec=DB.book.recent[it.ex], last='';
  if(rec&&rec.sets&&rec.sets.length){
    var p=rec.sets[r-1]||rec.sets[rec.sets.length-1];
    last='<div class="last">قبلی: <b>'+fa(p.weight)+'</b> × <b>'+fa(p.reps)+'</b>'+
         (p.rir!=null?' · ذخیره '+fa(p.rir):'')+'</div>';
  }
  var wTxt=(v.w==null?'':fa(v.w));
  var nf='<div class="inrow">'+
    '<div class="nf" id="nf_'+c+'">'+
      '<button class="nfb" onclick="bump(\''+key+'\',-1)">−</button>'+
      '<input class="nfv" id="w_'+c+'" readonly inputmode="decimal" value="'+wTxt+'" placeholder="؟" '+
        'data-key="'+key+'">'+
      '<span class="nfcap">پوند</span>'+
      '<button class="nfb" onclick="bump(\''+key+'\',1)">+</button>'+
    '</div>'+
    '<button class="wu'+(v.warmup?' on':'')+'" id="u_'+c+'" onclick="toggleWu(\''+key+'\')">گ</button>'+
    '<button class="ok" onclick="logSet(\''+key+'\')">✓</button>'+
  '</div>';

  /* تکرار: ردیف ضربه‌ای پهن و قابل اسکرول. ثانیه‌ای‌ها کشویی می‌مانند */
  var reps='';
  if(ex.unit==='reps'){
    var lo=Math.max(1,it.repLow-2), hi=it.repHigh+8;
    reps='<div class="chiprow"><span class="lb">تکرار</span><div class="cs">';
    for(var n=lo;n<=hi;n++){
      var cls=(n===v.reps?'on':(n>=it.repLow&&n<=it.repHigh?'tgt':''));
      reps+='<button class="'+cls+'" onclick="pickReps(\''+key+'\','+n+')">'+fa(n)+'</button>';
    }
    reps+='</div></div>';
  } else {
    reps='<div class="inrow" style="margin-top:8px;margin-bottom:0">'+
      '<div class="nf" id="nfr_'+c+'">'+
        '<button class="nfb" onclick="bumpR(\''+key+'\',-1)">−</button>'+
        '<input class="nfv" id="r_'+c+'" readonly inputmode="numeric" value="'+fa(v.reps)+'" '+
          'data-key="'+key+'" data-kind="r">'+
        '<span class="nfcap">'+unit+'</span>'+
        '<button class="nfb" onclick="bumpR(\''+key+'\',1)">+</button>'+
      '</div></div>';
  }
  return head+last+nf+reps;
}

/* ---- تغییر مقدار ---- */
function stepOf(key){ return DB.ex(ROWS[key].it.ex).step||2.5; }
function buzz(){ try{ if(navigator.vibrate) navigator.vibrate(8); }catch(e){} }
function setW(key,val){
  var v=pend(key), s=stepOf(key);
  if(val!=null && val<0) val=0;
  if(val!=null) val=Math.round(val/s)*s;
  v.w = val;
  var el=document.getElementById('w_'+cssKey(key));
  if(el) el.value=(val==null?'':fa(+val.toFixed(2)));
}
function setR(key,val){
  var v=pend(key);
  if(val<1) val=1;
  v.reps=val;
  var el=document.getElementById('r_'+cssKey(key));
  if(el) el.value=fa(val);
  var row=document.getElementById('row_'+cssKey(key));
  if(!row) return;
  var cs=row.querySelectorAll('.chiprow:not(.rir) .cs button');
  for(var i=0;i<cs.length;i++){
    var n=+toEn(cs[i].textContent);
    cs[i].classList.toggle('on', n===val);
  }
  centerChips(row);
}
function bump(key,dir){ var v=pend(key); setW(key,(v.w==null?0:v.w)+dir*stepOf(key)); buzz(); }
function bumpR(key,dir){ var v=pend(key); setR(key,v.reps+dir); buzz(); }
function pickReps(key,n){
  if(CHIP.moved){ CHIP.moved=false; return; }      // اسکرول بود، نه ضربه
  setR(key,n); buzz();
  var v=pend(key);
  if(v.w==null){ var el=document.getElementById('w_'+cssKey(key)); if(el) startType(el); return; }
  logSet(key);
}

/* ردیف تکرار قابل اسکرول است، پس ضربه را از کشیدن جدا کن */
var CHIP={x:0,moved:false};
function bindChips(root){
  var cs=(root||document).querySelectorAll('.chiprow:not(.rir) .cs');
  for(var i=0;i<cs.length;i++){
    cs[i].addEventListener('pointerdown',function(e){ CHIP.x=e.clientX; CHIP.moved=false; });
    cs[i].addEventListener('pointermove',function(e){ if(Math.abs(e.clientX-CHIP.x)>8) CHIP.moved=true; });
  }
  centerChips(root);
}
function centerChips(root){
  var cs=(root||document).querySelectorAll('.chiprow:not(.rir) .cs');
  for(var i=0;i<cs.length;i++){
    var on=cs[i].querySelector('button.on');
    if(!on) continue;
    var want=on.offsetLeft - cs[i].clientWidth/2 + on.offsetWidth/2;
    try{ cs[i].scrollLeft=want; }catch(e){}
  }
}

/* ---- کشیدن روی عدد ---- */
var DRAG=null;
function bindDrags(){
  var els=document.querySelectorAll('.nfv');
  for(var i=0;i<els.length;i++){
    var el=els[i];
    el.addEventListener('pointerdown',nfDown);
    el.addEventListener('pointermove',nfMove);
    el.addEventListener('pointerup',nfUp);
    el.addEventListener('pointercancel',function(){ DRAG=null; });
    el.addEventListener('blur',nfBlur);
  }
}
function nfDown(e){
  var el=e.currentTarget;
  if(!el.hasAttribute('readonly')) return;
  var key=el.getAttribute('data-key'), kind=el.getAttribute('data-kind')||'w';
  var v=pend(key);
  DRAG={el:el,key:key,kind:kind,x:e.clientX,
        v:(kind==='r'? v.reps : (v.w==null?0:v.w)), moved:false,last:0};
  try{ el.setPointerCapture(e.pointerId); }catch(er){}
}
function nfMove(e){
  if(!DRAG||DRAG.el!==e.currentTarget) return;
  var dx=e.clientX-DRAG.x;
  if(!DRAG.moved && Math.abs(dx)<7) return;
  DRAG.moved=true;
  e.preventDefault();
  var n=Math.round(dx/14);
  if(n===DRAG.last) return;
  DRAG.last=n;
  if(DRAG.kind==='r') setR(DRAG.key, DRAG.v+n);
  else setW(DRAG.key, DRAG.v + n*stepOf(DRAG.key));
  buzz();
}
function nfUp(e){
  if(!DRAG||DRAG.el!==e.currentTarget){ DRAG=null; return; }
  var el=DRAG.el, moved=DRAG.moved; DRAG=null;
  if(!moved) startType(el);
}
function startType(el){
  el.removeAttribute('readonly');
  el.value=toEn(el.value);
  el.focus();
  try{ el.setSelectionRange(0,el.value.length); }catch(e){}
}
function nfBlur(e){
  var el=e.currentTarget;
  if(el.hasAttribute('readonly')) return;
  el.setAttribute('readonly','');
  var key=el.getAttribute('data-key'), kind=el.getAttribute('data-kind')||'w';
  var val=num(el.value);
  if(kind==='r') setR(key, val==null?pend(key).reps:val);
  else setW(key, val);
}

/* ---- ثبت ---- */
function logSet(key){
  var k=parseKey(key), v=pend(key);
  if(v.reps==null||v.reps<=0){ alert('تعداد تکرار را مشخص کن.'); return; }
  var old=findSet(k.ex,k.block,k.round), rir=old?old.rir:null;
  DB.draft.sets=DB.draft.sets.filter(function(s){ return s!==old; });
  DB.draft.sets.push({ex:k.ex,block:k.block,round:k.round,
    weight:(v.w==null?0:v.w),reps:v.reps,rir:rir,warmup:!!v.warmup});
  DB.queueDraft();
  if(!v.warmup) Timer.start(ROWS[key].bl.rest,'استراحت بلوک '+k.block);
  refreshRow(key); updateCount(); buzz();
  seedNext(key);
}
/* وزنه ست بعدی همان حرکت را از این ست پر کن */
function seedNext(key){
  var R=ROWS[key], nk=R.it.ex+'|'+R.bl.id+'|'+(R.r+1);
  if(ROWS[nk] && !findSet(R.it.ex,R.bl.id,R.r+1)){
    var v=pend(key);
    PEND[nk]={w:v.w,reps:v.reps,warmup:false};
    refreshRow(nk);
  }
}
function refreshRow(key){
  var el=document.getElementById('row_'+cssKey(key));
  if(!el) return;
  el.className='setrow'+(findSet(ROWS[key].it.ex,ROWS[key].bl.id,ROWS[key].r)?' done':'');
  el.innerHTML=rowInner(key);
  var ins=el.querySelectorAll('.nfv');
  for(var i=0;i<ins.length;i++){
    ins[i].addEventListener('pointerdown',nfDown);
    ins[i].addEventListener('pointermove',nfMove);
    ins[i].addEventListener('pointerup',nfUp);
    ins[i].addEventListener('pointercancel',function(){ DRAG=null; });
    ins[i].addEventListener('blur',nfBlur);
  }
  bindChips(el);
}
function undoSet(key){
  var k=parseKey(key), st=findSet(k.ex,k.block,k.round);
  if(st) PEND[key]={w:st.weight,reps:st.reps,warmup:st.warmup};
  DB.draft.sets=DB.draft.sets.filter(function(s){ return !(s.ex===k.ex&&s.block===k.block&&s.round===k.round); });
  DB.queueDraft(); refreshRow(key); updateCount();
}
function toggleWu(key){
  var v=pend(key); v.warmup=!v.warmup;
  var b=document.getElementById('u_'+cssKey(key));
  if(b) b.classList.toggle('on',v.warmup);
  buzz();
}
function setRir(key,n){
  var k=parseKey(key), st=findSet(k.ex,k.block,k.round);
  if(!st) return;
  st.rir=(st.rir===n)?null:n;
  DB.queueDraft(); refreshRow(key); updateCount();
}
function addRound(bid){
  if(!DB.draft.extra) DB.draft.extra={};
  DB.draft.extra[bid]=(DB.draft.extra[bid]||0)+1;
  DB.queueDraft(); renderSession();
}
function delRound(bid){
  var n=(DB.draft.extra[bid]||0); if(n<1) return;
  var d=DB.day(DB.draft.dayId);
  var bl=d.blocks.filter(function(b){return b.id===bid;})[0];
  var r=rounds(bl)+n;
  DB.draft.sets=DB.draft.sets.filter(function(s){ return !(s.block===bid&&s.round===r); });
  DB.draft.extra[bid]=n-1;
  DB.queueDraft(); renderSession();
}
function cancelSession(){
  if(confirm('کل این جلسه حذف شود؟')){ Timer.stop(); DB.clearDraft().then(function(){ go('home'); }); }
}

document.getElementById('tskip').onclick=function(){ Timer.stop(); };
document.getElementById('modal').addEventListener('click',function(e){ if(e.target.id==='modal') closeSheet(); });
(function(){
  var bs=document.querySelectorAll('.nav button');
  for(var i=0;i<bs.length;i++){
    (function(b){ b.onclick=function(){ go(b.getAttribute('data-tab')); }; })(bs[i]);
  }
})();

  go(DB.draft ? 'session' : 'home');
