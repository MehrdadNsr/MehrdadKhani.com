<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eceadf">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PTE Email">
<meta name="description" content="تمرین تعاملی Write Email آزمون PTE Core">
<title>تمرین ایمیل PTE Core</title>
<link rel="canonical" href="https://mehrdadkhani.com/pte-email-trainer.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eceadf; --card:#fffdf7; --ink:#1b2430; --muted:#6f7885; --line:#d8d3c4;
  --red:#c0402f; --blue:#2b4a8b; --ok:#1d7a4c; --okbg:#e7f3ec;
  --err:#c0402f; --errbg:#fbeceb; --gold:#a8760f; --goldbg:#fbf3e0;
  --fa:'Vazirmatn','Segoe UI',Tahoma,sans-serif;
  --en:'Newsreader',Georgia,serif;
  --mono:'Courier Prime',ui-monospace,'Courier New',monospace;
  --r:13px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;direction:rtl;font-family:var(--fa);color:var(--ink);
  background:
    radial-gradient(circle at 12% 8%, #f6f4ea 0%, transparent 42%),
    radial-gradient(circle at 88% 92%, #f2efe2 0%, transparent 46%),
    var(--paper);
  background-attachment:fixed;
  min-height:100vh;line-height:1.9;
  font-size:clamp(14.5px,3.4vw,15.5px);
  padding:0 max(14px,env(safe-area-inset-left)) calc(70px + env(safe-area-inset-bottom));
}
.wrap{max-width:860px;margin:0 auto}
.en-txt,.en-line{font-family:var(--en);direction:ltr;text-align:left;unicode-bidi:isolate}
.mono{font-family:var(--mono);direction:ltr;unicode-bidi:isolate}

/* ---------- airmail signature ---------- */
.airmail{
  height:7px;border-radius:99px;
  background:repeating-linear-gradient(-45deg,
    var(--red) 0 9px, transparent 9px 18px,
    var(--blue) 18px 27px, transparent 27px 36px);
  opacity:.85;
}

/* ---------- header ---------- */
header{padding:22px 0 6px}
.masthead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.env{flex:0 0 auto;width:48px;height:34px;position:relative;animation:float 5s ease-in-out infinite}
.env svg{width:100%;height:100%;display:block}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}
.masthead h1{font-size:clamp(17px,4.6vw,21px);margin:0;font-weight:700;letter-spacing:-.01em}
.masthead .sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--blue);text-transform:uppercase;display:block;font-weight:700}
.postmark{
  margin-inline-start:auto;flex:0 0 auto;width:82px;height:82px;border:2px dashed var(--red);
  border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--red);transform:rotate(-11deg);opacity:.9;line-height:1.15;text-align:center;
}
.postmark b{font-family:var(--mono);font-size:21px;display:block}
.postmark span{font-size:9.5px;letter-spacing:.06em}
@media (max-width:520px){ .postmark{width:66px;height:66px} .postmark b{font-size:17px} }

/* ---------- nav ---------- */
nav{
  display:flex;gap:6px;overflow-x:auto;padding:14px 0 6px;margin-bottom:12px;
  scrollbar-width:none;-ms-overflow-style:none;
  -webkit-overflow-scrolling:touch;
}
nav::-webkit-scrollbar{display:none}
nav button{
  flex:0 0 auto;min-width:112px;min-height:46px;background:var(--card);border:1px solid var(--line);
  border-radius:11px;padding:7px 13px;cursor:pointer;text-align:right;font-family:var(--fa);
  font-size:13px;color:var(--muted);transition:transform .16s,background .16s,border-color .16s;line-height:1.4
}
nav button b{display:block;color:var(--ink);font-size:13.5px;font-weight:700}
nav button .n{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em}
nav button:hover{border-color:var(--blue);transform:translateY(-2px)}
nav button.on{background:var(--ink);border-color:var(--ink);color:#ffffffaa}
nav button.on b{color:#fff}
nav button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ---------- cards ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:18px 20px;margin-bottom:12px;
  box-shadow:0 1px 0 #fff inset, 0 2px 10px rgba(27,36,48,.045);
}
.card.stamped{position:relative;overflow:hidden}
.card.stamped::before{content:"";position:absolute;top:0;inset-inline:0;height:6px;
  background:repeating-linear-gradient(-45deg,var(--red) 0 8px,transparent 8px 16px,var(--blue) 16px 24px,transparent 24px 32px);opacity:.8}
.card.stamped{padding-top:24px}
.card h2{font-size:16px;margin:0 0 4px;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:13.5px;margin:0 0 14px}
.hint .e{font-family:var(--en);direction:ltr;unicode-bidi:isolate;font-style:italic}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:400}

/* ---------- mail surface ---------- */
.mail{
  background:#fffef9;border:1px solid var(--line);border-radius:11px;padding:16px 18px;
  font-family:var(--en);direction:ltr;text-align:left;font-size:clamp(15px,3.9vw,16.5px);
  line-height:2.02;white-space:pre-wrap;unicode-bidi:isolate;
  background-image:linear-gradient(transparent 97%, #ece7d8 97%);background-size:100% 2.02em;
}
.slot{display:inline-block;background:#e5ebf6;color:var(--blue);border-radius:5px;padding:0 6px;
  font-family:var(--mono);font-size:.72em;font-weight:700;vertical-align:middle}
.blank{display:inline-block;min-width:68px;border-bottom:2px solid var(--line);height:1.05em;vertical-align:baseline;margin:0 3px;transition:border-color .2s}
.blank.cur{border-bottom-color:var(--blue);border-bottom-width:3px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ---------- word bank ---------- */
.bank{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px;direction:ltr;justify-content:flex-start}
.word,.chunk{
  font-family:var(--mono);font-size:13.5px;padding:9px 13px;min-height:42px;border:1px solid var(--line);
  background:var(--card);border-radius:9px;cursor:pointer;color:var(--ink);
  transition:transform .13s,border-color .13s,background .13s;
}
.chunk{font-family:var(--en);font-size:15px;text-align:left}
.word:hover,.chunk:hover{border-color:var(--blue);background:#f2f5fb;transform:translateY(-2px)}
.word:active,.chunk:active{transform:translateY(0)}
.word.used{opacity:.22;pointer-events:none}
.chunk.ok{border-color:#b9dcc8;background:var(--okbg)}
.chunk.bad{border-color:#eec9c5;background:var(--errbg)}
.word:focus-visible,.chunk:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.pop{animation:pop .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.86)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.shake{animation:shake .34s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

/* ---------- forms ---------- */
textarea,input[type=text]{
  width:100%;font-family:var(--en);font-size:16px;line-height:1.85;padding:11px 13px;
  border:1px solid var(--line);border-radius:10px;background:#fffef9;color:var(--ink);
  direction:ltr;text-align:left;outline:none;resize:vertical;
}
textarea:focus,input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2b4a8b1f}
label.f{display:block;margin:11px 0 4px;font-size:12.5px;color:var(--muted)}
label.f b{font-family:var(--mono);font-size:11.5px;background:#e5ebf6;color:var(--blue);
  padding:1px 7px;border-radius:5px;margin-inline-end:7px;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}

/* ---------- buttons ---------- */
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.btn{
  font-family:var(--fa);font-size:14px;padding:10px 19px;min-height:44px;border-radius:10px;
  border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;
  transition:transform .14s,filter .14s;
}
.btn:hover{filter:brightness(1.22);transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:#e6e3d6;filter:none}
.btn.mut{background:transparent;color:var(--muted);border-color:var(--line)}
.btn:disabled{opacity:.32;cursor:not-allowed;transform:none;filter:none}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
kbd{font-family:var(--mono);font-size:10.5px;background:#e6e3d6;border:1px solid var(--line);
  border-bottom-width:2px;border-radius:4px;padding:1px 5px;color:var(--muted)}

/* ---------- feedback ---------- */
.fb{margin-top:13px;border-radius:11px;padding:13px 15px;border:1px solid;font-size:14px;animation:slide .3s ease both}
@keyframes slide{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.fb.good{background:var(--okbg);border-color:#b9dcc8;color:#125c38}
.fb.bad{background:var(--errbg);border-color:#eec9c5;color:#8e2c20}
.fb.warn{background:var(--goldbg);border-color:#e6d3a8;color:#78550a}
.fb .ttl{font-weight:700;display:block;margin-bottom:3px}
.fb .en-line{font-size:13.5px;margin-top:4px;opacity:.82}

/* ---------- diff ---------- */
.diff{font-family:var(--mono);direction:ltr;text-align:left;font-size:13.5px;line-height:2.2;
  background:#fffef9;border:1px solid var(--line);border-radius:10px;padding:13px;margin-top:12px;unicode-bidi:isolate}
.t-ok{color:var(--ok)}
.t-miss{color:var(--err);background:var(--errbg);border-radius:4px;padding:1px 4px;font-weight:700}
.t-extra{color:var(--muted);text-decoration:line-through}
.t-punc{color:var(--gold);background:var(--goldbg);border-radius:4px;padding:1px 4px}
.t-wrong{color:var(--err);text-decoration:line-through;opacity:.7}

/* ---------- gauge ---------- */
.gauge{margin-top:11px}
.gauge .bar{position:relative;height:10px;background:#e2ddcd;border-radius:99px;overflow:hidden}
.gauge .fill{position:absolute;inset-inline-start:0;top:0;bottom:0;background:var(--gold);
  transition:width .3s cubic-bezier(.3,1,.4,1),background .3s;border-radius:99px}
.gauge .fill.bad{background:var(--err)}
.gauge .fill.safe{background:var(--ok)}
.gauge .zone{position:absolute;top:0;bottom:0;background:#1d7a4c1f}
.gauge .marks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:4px;direction:ltr}
.count{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.count b{font-size:17px;color:var(--ink)}

/* ---------- timer ---------- */
.timer{font-family:var(--mono);font-size:clamp(24px,7vw,30px);font-weight:700;letter-spacing:.04em}
.timer.low{color:var(--red);animation:pulse 1s ease-in-out infinite}

/* ---------- prompt ---------- */
.prompt{background:#fbf9ef;border:1px solid var(--line);border-inline-start:3px solid var(--blue);
  border-radius:10px;padding:14px 16px;font-family:var(--en);direction:ltr;text-align:left;
  font-size:clamp(14.5px,3.8vw,15.5px);line-height:1.8;unicode-bidi:isolate}
.prompt ul{margin:8px 0 0;padding-inline-start:20px}
.prompt li{margin:2px 0}

/* ---------- misc ---------- */
.drop{display:flex;flex-wrap:wrap;gap:7px;min-height:52px;padding:10px;border:1.5px dashed var(--line);
  border-radius:10px;direction:ltr;align-items:flex-start;background:#fffef9}
.opts{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.opt{text-align:right;font-family:var(--fa);font-size:14px;padding:12px 14px;border:1px solid var(--line);
  background:var(--card);border-radius:10px;cursor:pointer;transition:.13s;line-height:1.6;min-height:48px}
.opt .e{font-family:var(--en);direction:ltr;display:block;text-align:left;unicode-bidi:isolate}
.opt:hover{border-color:var(--blue);transform:translateY(-1px)}
.opt.ok{border-color:#b9dcc8;background:var(--okbg)}
.opt.bad{border-color:#eec9c5;background:var(--errbg)}
.opt.dim{opacity:.45}
.picker{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pick{font-family:var(--fa);font-size:12.5px;padding:8px 12px;min-height:38px;border:1px solid var(--line);
  background:var(--card);border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:.13s}
.pick:hover{border-color:var(--blue)}
.pick.on{border-color:var(--ink);background:var(--ink);color:#fff;font-weight:700}
.pick .dots{display:flex;gap:2px}
.pick .dots i{width:5px;height:5px;border-radius:50%;background:#cfc9b7;display:block;transition:.2s}
.pick.on .dots i{background:#ffffff44}
.pick .dots i.f{background:var(--ok)}
.pick.on .dots i.f{background:#7fe3ab}

.scores{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.sc{background:#fbf9ef;border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.sc .h{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px}
.sc .h .v{font-family:var(--mono);font-weight:700;font-size:14px}
.sc p{margin:4px 0 0;font-size:12.5px;color:var(--muted);line-height:1.7}

table.tb{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:10px}
table.tb td,table.tb th{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right}
table.tb th{font-size:11.5px;color:var(--muted);font-weight:700}
table.tb td.m{font-family:var(--mono);direction:ltr;text-align:left;unicode-bidi:isolate}

.prog{height:5px;background:#e2ddcd;border-radius:99px;overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--ok));transition:width .45s cubic-bezier(.3,1,.4,1)}
.budget{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:8px}
.budget b{color:var(--ink);font-size:14px}
.budget .over{color:var(--err)}

.bigstamp{
  position:relative;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
  width:118px;height:118px;border:3px solid var(--ok);border-radius:8px;color:var(--ok);
  transform:rotate(-8deg);font-family:var(--mono);animation:thud .5s cubic-bezier(.2,1.5,.4,1) both;
  background:#ffffffc9;
}
.bigstamp.mid{border-color:var(--gold);color:var(--gold)}
.bigstamp.low{border-color:var(--red);color:var(--red)}
.bigstamp b{font-size:31px;line-height:1.1}
.bigstamp span{font-size:10.5px;letter-spacing:.1em}
.bigstamp em{font-family:var(--fa);font-style:normal;font-size:11px;margin-top:3px}
@keyframes thud{0%{transform:scale(2.4) rotate(-20deg);opacity:0}70%{transform:scale(.94) rotate(-8deg);opacity:1}100%{transform:scale(1) rotate(-8deg)}}

.screen{animation:enter .34s ease both}
@keyframes enter{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.screen .card{animation:enter .38s ease both}
.screen .card:nth-child(2){animation-delay:.05s}
.screen .card:nth-child(3){animation-delay:.1s}
.screen .card:nth-child(4){animation-delay:.15s}
.screen .card:nth-child(5){animation-delay:.2s}

.selfchk{background:#fbf9ef;border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-top:12px;font-size:13.5px}
.selfchk b{display:block;margin-bottom:8px}
.cbx{display:flex;gap:9px;align-items:flex-start;margin:7px 0;cursor:pointer;line-height:1.6}
.cbx input{width:19px;height:19px;margin:3px 0 0;accent-color:var(--ok);flex:0 0 auto}
.cbx span{font-family:var(--en);direction:ltr;text-align:left;unicode-bidi:isolate;font-size:14px}
#cbres{margin-top:9px;font-family:var(--fa);direction:rtl}
footer{text-align:center;color:var(--muted);font-size:11.5px;padding:26px 0 0}

@media (max-width:640px){
  .scores,.grid2{grid-template-columns:1fr}
  .card{padding:15px 15px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="masthead">
      <div class="env" aria-hidden="true">
        <svg viewBox="0 0 48 34" fill="none">
          <rect x="1.5" y="1.5" width="45" height="31" rx="3" fill="#fffdf7" stroke="#1b2430" stroke-width="2"/>
          <path d="M2 3l22 16L46 3" stroke="#c0402f" stroke-width="2" fill="none"/>
          <path d="M2 31l16-12M46 31L30 19" stroke="#2b4a8b" stroke-width="1.6"/>
        </svg>
      </div>
      <div>
        <span class="sub">Write Email &middot; 9 min &middot; 50&ndash;120 w</span>
        <h1>تمرین ایمیل PTE Core</h1>
      </div>
      <div class="postmark" id="pm">
        <b id="pmv">0%</b><span>دقت</span>
      </div>
    </div>
    <div class="airmail" style="margin-top:12px"></div>
    <div class="prog"><i id="progbar" style="width:0%"></i></div>
  </header>

  <nav id="nav"></nav>
  <noscript>
    <div class="card stamped" style="border-color:var(--red)">
      <h2>جاوااسکریپت خاموشه</h2>
      <p class="hint" style="margin:0">این تمرین بدون جاوااسکریپت کار نمی‌کنه. تو تنظیمات مرورگر روشنش کن، یا فایل رو با Chrome یا Safari باز کن نه با نمایشگر فایل.</p>
    </div>
  </noscript>
  <div id="screen" class="screen"><div class="card stamped" id="boot"><h2>در حال بارگذاری</h2><p class="hint" style="margin:0">اگه این پیام موند و چیزی نیومد، یعنی جاوااسکریپت اجرا نشده. فایل رو مستقیم با مرورگر باز کن.</p></div></div>

  <footer>
    یک فایل، بدون نصب، بدون اینترنت. پیشرفتت روی همین دستگاه ذخیره می‌شه.
  </footer>
</div>

{id:"close",fa:"پایان",br:1,text:"I am looking forward to hearing from you.",

{id:"sign",fa:"امضا",br:1,text:"Regards,",keys:["Regards,"],chunks:["Regards,"]}],
hints:{MP:{fa:"موضوع کلی نامه",ph:"the new weekday closing time"},
 P1:{fa:"نکته اول، از bullet ۱",ph:"keeping the evening slot open"},
 N1:{fa:"چه کسی سود می‌بره",ph:"members who work shifts"},

/* =================== UTILS =================== */
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];})}
function tok(s){s=String(s||"").trim();return s?s.split(/\s+/):[]}
function norm(w){return String(w||"").toLowerCase().replace(/[\[\]().,!?;:'"]/g,"").trim()}
function punc(w){var m=String(w||"").match(/[.,!?;:]/g);return m?m.join(""):""}
function wc(s){return tok(s).length}
function isSlot(w){return String(w).indexOf("[")>-1}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){var c=a.slice(),i,j,t;for(i=c.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=c[i];c[i]=c[j];c[j]=t}return c}
function noteFor(w){var k=norm(w);return NOTES[k]||NOTES[k+"."]||NOTES[k+","]||null}
function fmtT(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}

function diffTokens(exp,got){
  var a=exp.map(norm),b=got.map(norm),m=a.length,n=b.length,i,j;
  var dp=[];for(i=0;i<=m;i++){dp.push(new Array(n+1).fill(0))}
  for(i=m-1;i>=0;i--)for(j=n-1;j>=0;j--)
    dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  var out=[],miss=[],pe=0;i=0;j=0;
  while(i<m&&j<n){
    if(a[i]===b[j]){var bad=punc(exp[i])!==punc(got[j]);if(bad)pe++;
      out.push({t:bad?"punc":"ok",w:got[j],exp:exp[i]});i++;j++;}
    else if(dp[i+1][j]>=dp[i][j+1]){out.push({t:"miss",w:exp[i]});miss.push(exp[i]);i++;}
    else{out.push({t:"extra",w:got[j]});j++;}
  }
  while(i<m){out.push({t:"miss",w:exp[i]});miss.push(exp[i]);i++}
  while(j<n){out.push({t:"extra",w:got[j]});j++}
  var ok=out.filter(function(x){return x.t==="ok"||x.t==="punc"}).length;
  return {parts:out,acc:m?Math.round(ok/m*100):0,miss:miss,puncErr:pe};
}

function slotsOf(fr){var s=[];fr.lines.forEach(function(l){
  (l.text.match(/\[([A-Z0-9]+)\]/g)||[]).forEach(function(x){var k=x.slice(1,-1);if(s.indexOf(k)<0)s.push(k)})});return s}

function skelWords(fr){var n=0;fr.lines.forEach(function(l){
  n+=tok(l.text).filter(function(w){return !isSlot(w)}).length});return n+2}

function renderFrame(fr,f,name,rec){
  var out=[];
  fr.lines.forEach(function(l){
    var t=l.text;
    if(l.id==="greet"&&rec&&rec.trim())t="Dear "+rec.trim()+",";
    t=t.replace(/\[([A-Z0-9]+)\]/g,function(_,k){return (f[k]&&f[k].trim())?f[k].trim():"["+k+"]"});
    out.push(t); if(l.br===2)out.push("");
  });
  out.push(name||"Your Name");
  return out.join("\n");
}

function overlap(src,cand){
  var A={},B=[],i;
  tok(src).map(norm).forEach(function(w){if(w.length>3)A[w]=1});
  B=tok(cand).map(norm).filter(function(w){return w.length>3});
  if(!B.length)return 0;
  return B.filter(function(w){return A[w]}).length/B.length;
}

function mailHTML(t){
  return esc(t).replace(/\[([A-Z0-9]+)\]/g,function(_,k){return '<span class="slot">'+k+'</span>'});
}
function diffHTML(parts){
  return parts.map(function(p){
    var c=p.t==="ok"?"t-ok":p.t==="miss"?"t-miss":p.t==="punc"?"t-punc":"t-extra";
    return '<span class="'+c+'">'+esc(p.w)+'</span> ';
  }).join("");
}
function fbHTML(o){
  var c=o.warn?"warn":o.good?"good":"bad";
  return '<div class="fb '+c+'"><span class="ttl">'+esc(o.t)+'</span>'+
    (o.fa?'<div>'+esc(o.fa)+'</div>':'')+
    (o.en?'<div class="en-line">'+esc(o.en)+'</div>':'')+'</div>';
}

function frame(){return FRAMES[S.fk]}

function score(good){
  var l=line(),k=S.fk+":"+l.id;
  if(S.lv>=1&&S.lv<=3)S.boxes[k]=good?Math.min(5,(S.boxes[k]||0)+1):1;
  S.stats.streak=good?S.stats.streak+1:0;
  if(good)S.stats.right++;else S.stats.wrong++;
  if(S.stats.streak>S.stats.best)S.stats.best=S.stats.streak;
  save();head();
}
function logErr(w,lid){
  var e=S.errors[w]||{n:0,line:lid};e.n++;e.line=lid;S.errors[w]=e;save();
}
function acc(){var t=S.stats.right+S.stats.wrong;return t?Math.round(S.stats.right/t*100):0}

function go(){ try{ go_() }catch(err){ crash(err) } }
function crash(err){
  var m=(err&&(err.message||err))+"";
  var st=(err&&err.stack?String(err.stack).split("\n").slice(0,4).join(" | "):"");
  try{
    document.getElementById("screen").innerHTML=
      '<div class="card stamped" style="border-color:var(--red)"><h2>یه خطا رخ داد</h2>'+
      '<p class="hint">این پیام رو برام بفرست تا درستش کنم.</p>'+
      '<div class="diff" style="color:var(--err)">'+esc(m)+'<br><br>'+esc(st)+'</div>'+
      '<div class="row"><button class="btn" onclick="try{localStorage.removeItem(\'pte_email_html\')}catch(e){};location.reload()">ریست و بارگذاری دوباره</button></div></div>';
  }catch(e2){
    document.body.innerHTML='<pre dir="ltr" style="padding:20px;white-space:pre-wrap">ERROR: '+m+'</pre>';
  }
}
function go_(){
  nav();head();
  var f=[renderDecode,renderSkeleton,renderFade,renderScramble,renderParaphrase,renderSlots,renderExam,renderStats][S.lv];
  var sc=$("#screen");sc.classList.remove("screen");void sc.offsetWidth;sc.classList.add("screen");
  sc.innerHTML=f();bindAll();
  if(S.lv!==7)sc.insertAdjacentHTML("beforeend",fullCard());
  bindFull();
  try{ if("scrollBehavior" in document.documentElement.style) window.scrollTo({top:0,behavior:"smooth"}); else window.scrollTo(0,0); }catch(e){}
}

/* =================== L1 SKELETON =================== */
var SK={};
function skInit(){
  var l=line(),w=tok(l.text),used={},bl=[];
  l.keys.forEach(function(k){
    for(var i=0;i<w.length;i++){if(!used[i]&&norm(w[i])===norm(k)){used[i]=1;bl.push(i);break}}
  });
  bl.sort(function(a,b){return a-b});
  var corr=bl.map(function(i){return w[i]});
  var extra=shuffle(DISTRACTORS.filter(function(d){
    return !corr.some(function(c){return norm(c)===norm(d)})})).slice(0,3);
  SK={key:S.fk+S.idx,w:w,bl:bl,bank:shuffle(corr.concat(extra)),filled:{},fb:null};
}
function renderSkeleton(){
  if(SK.key!==S.fk+S.idx)skInit();
  var l=line(),w=SK.w,nx=null,i;
  for(i=0;i<SK.bl.length;i++){if(SK.filled[SK.bl[i]]===undefined){nx=SK.bl[i];break}}
  var done=nx===null;
  var body=w.map(function(x,i){
    if(isSlot(x)){var m=x.match(/\[([A-Z0-9]+)\]/);return '<span class="slot">'+m[1]+'</span>'+esc(x.replace(/\[[A-Z0-9]+\]/,""))+' '}
    if(SK.bl.indexOf(i)>-1){
      if(SK.filled[i]===undefined)return '<span class="blank'+(i===nx?" cur":"")+'"></span> ';
      return '<span class="t-ok" style="font-weight:500">'+esc(x)+'</span> ';
    }
    return esc(x)+' ';
  }).join("");
  var bank=SK.bank.map(function(x,bi){
    var u=Object.keys(SK.filled).some(function(k){return SK.filled[k]===bi});
    return '<button class="word'+(u?" used":"")+'" data-bi="'+bi+'">'+esc(x)+'</button>';
  }).join("");
  var h='<div class="card stamped"><h2>'+l.fa+' <span class="tag">'+FRAMES[S.fk].fa+'</span></h2>'+
   frameBar("sk")+sentBar()+
   '<p class="hint">کلمه درست رو انتخاب کن. اگه غلط بزنی جای خالی باز می‌مونه تا خودت درستش کنی. اسلات‌های آبی ثابتن.</p>'+
   '<div class="mail" id="mail">'+body+'</div>'+
   '<div class="bank" id="bank">'+bank+'</div>'+
   '<div id="fb">'+(SK.fb?fbHTML(SK.fb):"")+'</div>'+
   '<div class="row"><button class="btn" id="nx" '+(done?"":"disabled")+'>جمله بعدی <kbd>Enter</kbd></button>'+
   '<button class="btn ghost" id="again">دوباره همین</button>'+
   '<button class="btn mut" id="weak">ضعیف‌ترین جمله‌م</button></div></div>';
  setTimeout(function(){
    bindAll();
    $$('#bank .word').forEach(function(b){b.onclick=function(){
      if(nx===null)return;
      var t=w[nx],r=norm(b.textContent)===norm(t),nt=noteFor(t);
      if(r){
        SK.filled[nx]=+b.dataset.bi;
        var tp=pick(TIPS);
        SK.fb={good:true,t:"درست",fa:nt?nt.fa:tp.fa,en:nt?nt.en:tp.en};
        score(true);
      }else{
        logErr(norm(t),l.id);score(false);
        SK.fb={good:false,t:"نه، دوباره امتحان کن",fa:nt?nt.fa:"به کلمه قبل و بعدش نگاه کن. معمولاً حرف اضافه یا شکل فعل تعیین‌کننده‌ست.",en:nt?nt.en:""};
        b.classList.add("shake");
      }
      setTimeout(go,r?0:340);
    }});
    var n1=$("#nx");if(n1)n1.onclick=function(){S.idx=(S.idx+1)%frame().lines.length;save();go()};
    $("#again").onclick=function(){skInit();go()};
    $("#weak").onclick=weakest;
    KEY=function(e){if(e.key==="Enter"&&done){e.preventDefault();S.idx=(S.idx+1)%frame().lines.length;save();go()}};
  },0);
  return h;
}
function weakest(){
  var b=0,bv=99;frame().lines.forEach(function(l,i){var v=S.boxes[S.fk+":"+l.id]||0;if(v<bv){bv=v;b=i}});
  S.idx=b;save();go();
}

/* =================== L2 FADE =================== */
var FD={};
function renderFade(){
  var l=line(),w=tok(l.text);
  if(FD.key!==S.fk+S.idx){FD={key:S.fk+S.idx,stage:0,val:"",res:null}}
  var ratio=[0.3,0.7,1][FD.stage];
  var idxs=[],i;for(i=1;i<w.length;i++)if(!isSlot(w[i]))idxs.push(i);
  var cnt=Math.round(idxs.length*ratio),hid={},step=idxs.length/Math.max(1,cnt);
  for(i=0;i<cnt;i++)hid[idxs[Math.min(idxs.length-1,Math.floor(i*step))]]=1;
  var body=w.map(function(x,i){
    if(isSlot(x)){var m=x.match(/\[([A-Z0-9]+)\]/);return '<span class="slot">'+m[1]+'</span>'+esc(x.replace(/\[[A-Z0-9]+\]/,""))+' '}
    return hid[i]?'<span style="color:#c9c3b2">'+"_".repeat(Math.max(2,x.length))+'</span> ':esc(x)+' ';
  }).join("");
  var r=FD.res,fb="";
  if(r){
    var nt=null,fm=r.miss.filter(function(x){return !isSlot(x)})[0];
    if(fm)nt=noteFor(fm);
    var good=r.acc>=90&&r.puncErr===0;
    fb='<div class="diff">'+diffHTML(r.parts)+'</div>'+
      fbHTML({good:good,warn:r.acc>=90&&r.puncErr>0,
        t:r.acc>=90?(r.puncErr>0?"دقت "+r.acc+"٪ ولی "+r.puncErr+" تا علامت نگارشی غلطه":"دقت "+r.acc+"٪"):"دقت "+r.acc+"٪",
        fa:r.puncErr>0?"زردها کلمه‌شون درسته ولی کاما یا نقطه‌شون نه.":nt?nt.fa:good?r.tip.fa:"قرمزها جا افتادن یا اشتباه نوشته شدن.",
        en:nt?nt.en:(good?r.tip.en:"")});
  }
  var h='<div class="card stamped"><h2>'+l.fa+' <span class="tag">Fade '+(FD.stage+1)+'/3 &middot; '+FRAMES[S.fk].fa+'</span></h2>'+
   frameBar("fd")+sentBar()+
   '<p class="hint">جمله رو کامل تایپ کن، با کاما و نقطه. اسلات‌ها رو همون‌طور بنویس: <span class="e">MP, P1, N1</span></p>'+
   '<div class="mail">'+body+'</div>'+
   '<textarea id="ta" rows="3" placeholder="Type the full sentence, punctuation included...">'+esc(FD.val)+'</textarea>'+
   '<div class="row"><button class="btn" id="chk">بررسی <kbd>Ctrl+Enter</kbd></button>'+
   (r&&FD.stage<2?'<button class="btn ghost" id="hard">سخت‌تر</button>':'')+
   (r&&FD.stage===2?'<button class="btn ghost" id="nx">جمله بعدی</button>':'')+
   '<button class="btn mut" id="clr">پاک کن</button>'+
   '<button class="btn mut" id="weak">ضعیف‌ترین</button></div>'+fb+'</div>';
  setTimeout(function(){
    bindAll();
    var ta=$("#ta");ta.oninput=function(){FD.val=ta.value};
    $("#chk").onclick=function(){
      if(!ta.value.trim())return;
      FD.val=ta.value;
      var d=diffTokens(w,tok(ta.value));
      d.miss.forEach(function(x){if(!isSlot(x))logErr(norm(x),l.id)});
      d.tip=pick(TIPS);FD.res=d;
      score(d.acc>=90&&d.puncErr===0);go();
    };
    var hb=$("#hard");if(hb)hb.onclick=function(){FD.stage++;FD.val="";FD.res=null;go()};
    var nb=$("#nx");if(nb)nb.onclick=function(){S.idx=(S.idx+1)%frame().lines.length;FD={};save();go()};
    $("#clr").onclick=function(){FD.val="";FD.res=null;go()};
    $("#weak").onclick=function(){FD={};weakest()};
    KEY=function(e){if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();$("#chk").click()}};
  },0);
  return h;
}

      if(/^(to |say |describe |explain |mention |state |give |ask |propose |suggest )/i.test(v))
        i.push("با فعل امری bullet شروع نکن. باید عبارت اسمی باشه که تو جمله بشینه.");
      if(/^[A-Z]/.test(v)&&!/^I\b/.test(v))i.push("با حرف بزرگ شروع نکن، وسط جمله قرار می‌گیره.");
      PP.res={i:i,tip:pick(TIPS)};score(i.length===0);go();
    };
    $("#smp").onclick=function(){PP.val=p.sample[sk];PP.res=null;go()};
    KEY=function(e){if(e.key==="Enter"&&document.activeElement===inp){e.preventDefault();$("#chk").click()}};
  },0);
  return h;
}

/* =================== LOCAL GRADER =================== */
function gradeLocal(text,p){
  var n=wc(text),low=" "+text.toLowerCase()+" ";
  var form=(n>=50&&n<=120)?2:((n>=30&&n<=150)?1:0);
  var greet=/^\s*(dear|hi|hello)\b/i.test(text);
  var bye=/(kind regards|best regards|yours sincerely|yours faithfully|best wishes|regards|sincerely)/i.test(text);
  var ls=text.trim().split(/\n/).filter(function(x){return x.trim()});
  var last=ls[ls.length-1]||"";
  var sig=ls.length>1&&wc(last)<=4&&!/regard|sincerel|wishes/i.test(last);
  var conv=(greet?1:0)+(bye?1:0); if(conv===2&&!sig)conv=1;
  var conn=[/firstly|first of all|to begin with|the main issue/i,
            /secondly|in addition|on top of that|furthermore/i,
            /lastly|finally|for these reasons/i];
  var ncon=conn.filter(function(r){return r.test(text)}).length;
  var paras=text.trim().split(/\n\s*\n/).filter(function(x){return wc(x)>=8});
  var points=Math.max(ncon,Math.max(0,paras.length-1));
  var STOP={"write":1,"email":1,"your":1,"about":1,"that":1,"this":1,"with":1,"from":1,"have":1,"been":1,"they":1,"their":1,"there":1,"which":1,"would":1,"could":1,"should":1,"asked":1,"asking":1,"please":1};
  var keys=[],seen={};
  tok(p.situation).map(norm).forEach(function(x){
    if(x.length>4&&!STOP[x]&&!seen[x]){seen[x]=1;keys.push(x)}});
  var hits2=keys.filter(function(x){return low.indexOf(x.slice(0,5))>-1});
  var topical=hits2.length;
  /* Content is NOT auto-scored: rules cannot tell whether each bullet was
     actually answered, and penalising paraphrase would teach the wrong habit.
     The user self-checks it against the three bullets instead. */
  var org=(ncon>=3&&paras.length>=4)?2:(ncon>=2||paras.length>=4)?1:0;
  var copied=p.bullets.filter(function(b){
    var bw=tok(b).map(norm).filter(function(x){return x.length>3});
    if(bw.length<3)return false;
    var hit=bw.filter(function(x){return low.indexOf(" "+x+" ")>-1}).length;
    return hit/bw.length>0.8;
  }).length;
  var words=tok(text).map(norm).filter(function(x){return x.length>3});
  var uq={};words.forEach(function(x){uq[x]=1});
  var ttr=words.length?Object.keys(uq).length/words.length:0;
  var vocab=ttr>0.62?2:ttr>0.5?1:0;
  if(copied)vocab=Math.max(0,vocab-1);
  var hits=[];
  ERRPAT.forEach(function(e){var m=text.match(e.re);if(m)hits.push({w:m[0],f:e.fix,fa:e.fa,k:e.k})});
  var sp=hits.filter(function(x){return x.k==="spell"}).length;
  var gr=hits.filter(function(x){return x.k==="gram"}).length;
  var sents=text.split(/[.!?]+/).filter(function(x){return wc(x)>0});
  var longS=sents.filter(function(x){return wc(x)>42}).length;
  var noCap=sents.filter(function(x){return x.trim()&&/^[a-z]/.test(x.trim())}).length;
  var grammar=Math.max(0,2-gr-(longS>0?1:0));
  var spell=Math.max(0,2-sp-(noCap>1?1:0));
  return {n:n,points:points,topical:topical,copied:copied,hits:hits,longS:longS,noCap:noCap,
    ttr:Math.round(ttr*100),ncon:ncon,paras:paras.length,greet:greet,bye:bye,sig:sig,
    scores:{
      content:{v:null,fa:points+" نکته مجزا و "+topical+" واژه مرتبط با پرامپت. نمره‌ش رو خودت پایین تیک بزن."},
      form:{v:form,fa:n+" کلمه. بازه نمره کامل ۵۰ تا ۱۲۰ ه."},
      organization:{v:org,fa:ncon+" کانکتور اصلی و "+paras.length+" پاراگراف."},
      conventions:{v:conv,fa:(greet?"خطاب ✓ ":"خطاب ✗ ")+(bye?"خداحافظی ✓ ":"خداحافظی ✗ ")+(sig?"امضا ✓":"امضا ✗")},
      grammar:{v:grammar,fa:gr?gr+" الگوی خطای شناخته‌شده پیدا شد.":(longS?"یه جمله بیشتر از ۴۲ کلمه داری.":"الگوی خطای رایجی پیدا نشد.")},
      vocabulary:{v:vocab,fa:"تنوع واژگان "+Math.round(ttr*100)+"٪"+(copied?" و "+copied+" تا bullet عیناً کپی شده.":".")},
      spelling:{v:spell,fa:sp?sp+" غلط املایی رایج پیدا شد.":(noCap>1?"چند جمله با حرف کوچک شروع شده.":"غلط املایی رایجی پیدا نشد.")}
    }};
}

function renderStats(){

  var aw=ex.length?Math.round(ex.reduce(function(a,e){return a+e.wpm},0)/ex.length):"-";
  var mastered=0,tot=0;
  FK.forEach(function(k){FRAMES[k].lines.forEach(function(l){tot++;if((S.boxes[k+":"+l.id]||0)>=4)mastered++})});
  var h='<div class="card stamped"><h2>وضعیت</h2><div class="budget" style="font-size:13px">'+
   '<span>دقت کلی <b>'+acc()+'٪</b></span><span>استریک <b>'+S.stats.streak+'</b> (رکورد '+S.stats.best+')</span>'+
   '<span>میانگین نمره <b>'+av+'</b>/14</span><span>میانگین سرعت <b>'+aw+'</b> wpm</span>'+
   '<span>امتحان‌ها <b>'+ex.length+'</b></span><span>جمله‌های مسلط <b>'+mastered+'</b>/'+tot+'</span></div>'+
   '<div class="prog"><i style="width:'+(tot?Math.round(mastered/tot*100):0)+'%"></i></div>'+
   '<p class="hint" style="margin:10px 0 0">نوار بالا نشون می‌ده چند تا از ۲۱ جمله‌ی سه قالب رو حداقل چهار بار پشت‌سرهم درست زدی.</p></div>'+
   '<div class="card"><h2>غلط‌های تکراری من</h2>';
  if(!errs.length)h+='<p class="hint" style="margin:0">هنوز غلطی ثبت نشده. چند دور تو لول‌های ۱ و ۲ بزن تا اینجا پر بشه.</p>';
  else{
    h+='<p class="hint">این‌ها رو بیشتر از همه غلط زدی. روی «تمرین» بزنی می‌ری سر همون جمله.</p>'+
     '<table class="tb"><thead><tr><th>کلمه</th><th>دفعات</th><th></th></tr></thead><tbody>'+
     errs.map(function(e){
       return '<tr><td class="m">'+esc(e[0])+'</td><td class="m">'+e[1].n+'</td>'+
        '<td><button class="btn mut" style="padding:4px 11px;min-height:32px;font-size:12.5px" data-dl="'+esc(e[1].line)+'">تمرین</button></td></tr>';
     }).join("")+'</tbody></table>';
    var top=NOTES[errs[0][0]];
    if(top)h+=fbHTML({good:false,t:"بیشترین غلطت: "+errs[0][0],fa:top.fa,en:top.en});
  }
  h+='</div><div class="card"><h2>تنظیمات</h2>'+
   '<label class="f"><b>NAME</b>اسمی که آخر ایمیل میاد</label>'+
   '<input type="text" id="nm" value="'+esc(S.name)+'">'+
   '<div class="row"><button class="btn" id="svn">ذخیره اسم</button>'+
   '<button class="btn mut" id="rst">پاک کردن کل پیشرفت</button></div>'+
   '<p class="hint" style="margin:14px 0 0">همه‌چی روی همین مرورگر ذخیره می‌شه. اگه حالت ناشناس (incognito) باز کنی یا حافظه مرورگر رو پاک کنی، پیشرفت می‌پره.</p></div>';
  setTimeout(function(){
    $$('[data-dl]').forEach(function(b){b.onclick=function(){
      var lid=b.dataset.dl,i=frame().lines.map(function(l){return l.id}).indexOf(lid);
      if(i<0){for(var k=0;k<FK.length;k++){var j=FRAMES[FK[k]].lines.map(function(l){return l.id}).indexOf(lid);
        if(j>=0){S.fk=FK[k];i=j;break}}}
      if(i>=0){S.idx=i;S.lv=2;FD={};save();go()}
    }});
    $("#svn").onclick=function(){S.name=$("#nm").value||"Your Name";save();go()};
    $("#rst").onclick=function(){
      if(confirm("مطمئنی؟ همه پیشرفت، آمار و غلط‌ها پاک می‌شه.")){
        var nm=S.name;S=fresh();S.name=nm;EX={text:"",left:540,run:false,grade:null,start:null,model:false,mock:false,part:1,ms:[]};SK={};FD={};SCR={};PP={};SL={};DEC={};save();go();}
    };
  },0);
  return h;
}

/* =================== INIT =================== */
var KEY=null;
document.addEventListener("keydown",function(e){
  if(e.altKey&&e.key>="1"&&e.key<="8"){e.preventDefault();S.lv=+e.key-1;save();go();return}
  if(KEY)KEY(e);
});
if(!S.seen){
  S.seen=1;save();
  setTimeout(function(){
    var w=document.createElement("div");
    w.className="card stamped";
    w.style.cssText="position:fixed;inset:auto 16px 16px 16px;max-width:520px;margin:0 auto;z-index:99;box-shadow:0 12px 40px #1b243033";
    w.innerHTML='<h2>قبل از شروع</h2><p class="hint" style="margin-bottom:10px">اسم آخر ایمیل رو از تب «آمار و غلط‌ها» به اسم خودت عوض کن. اگه تازه شروع کردی، از لول ۰۰ برو جلو.</p><div class="row" style="margin-top:0"><button class="btn" id="okw">باشه</button></div>';
    document.body.appendChild(w);
    $("#okw").onclick=function(){w.remove()};
  },600);
}
try{ go(); var bt=document.getElementById("boot"); if(bt)bt.parentNode.removeChild(bt); }
catch(err){ crash(err) }

</script>
