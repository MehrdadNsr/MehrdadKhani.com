name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Publish the site only. Agent/internal files (CLAUDE.md, AGENTS.md, README and other
      # *.md notes, .claude/, tools/, tests/, package.json) stay in the repo but are never served.
      - name: Assemble site files
        run: |
          set -euo pipefail
          rsync -a \
            --exclude='_site/' --exclude='.git/' --exclude='.github/' --exclude='.claude/' \
            --exclude='.gitignore' --exclude='.nojekyll' --exclude='*.md' \
            --exclude='tools/' --exclude='tests/' \
            --exclude='package.json' --exclude='package-lock.json' \
            ./ _site/
          find _site -type f | sort
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
